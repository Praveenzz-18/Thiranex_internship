<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>To‑Do — Praveen Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>To‑Do List</h1>
        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="todo.html" aria-current="page">To-Do</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="todo-heading" class="card">
            <h2 id="todo-heading">Manage your tasks</h2>

            <form id="new-task-form" aria-label="Add new task">
                <div style="display:flex;gap:.5rem;align-items:center">
                    <input id="new-task-input" type="text" placeholder="Add a task and press Enter" aria-label="New task" required>
                    <input id="new-task-due" type="date" aria-label="Due date (optional)">
                </div>
            </form>

            <div class="todo-controls">
                <div class="filters" role="tablist" aria-label="Filter tasks">
                    <button data-filter="all" class="filter-btn" aria-pressed="true">All</button>
                    <button data-filter="active" class="filter-btn" aria-pressed="false">Active</button>
                    <button data-filter="completed" class="filter-btn" aria-pressed="false">Completed</button>
                </div>
                <div style="display:flex;gap:0.5rem;align-items:center">
                    <button id="export-tasks" class="btn secondary">Export</button>
                    <input id="import-file" type="file" accept="application/json" style="display:none" aria-hidden="true">
                    <button id="import-tasks" class="btn secondary">Import</button>
                    <button id="clear-completed" class="btn">Clear completed</button>
                </div>
            </div>

            <ul id="task-list" aria-live="polite"></ul>

            <p id="task-count" class="muted"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Praveen</p>
    </footer>

    <script src="scripts/theme-toggle.js" defer></script>
    <script src="scripts/todo.js" defer></script>
</body>
</html>
